[package]
name = "denkeez"
version = "0.17.0"
description = "Denkeez (デンキーズ・仮称) — 電気工事業者向け平面図エディタ"
authors = ["Daisuke (有限会社 北嶺建設)"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "denkeez_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-opener = "2"
